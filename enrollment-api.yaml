openapi: 3.1.0
info:
  title: Watcher Enrollment API
  version: "0.1.0"
  description: >
    Bundles all 4 CSR-relay operations — two called by a watcher, two by
    a job_submitter — into one logical API surface.

    watcher

    - submitCertificateSigningRequest
    - grabAuthorizedCertificate

    job_submitter 

    - receiveCertificateSigningRequests
    - submitApprovedCertificateSigningRequests
security:
  - mtls: []
servers:
  - url: https://localhost:3031/watcher
paths:
  /csrs:
    post:
      operationId: submitCertificateSigningRequest
      summary: potential watcher submits a CSR for approval job_submitter approval
      description: >
        Server validates the CSR's self-signature (proof the caller holds
        the matching private key) before storing it, keyed by a random
        request_id, pending review by target_submitter_cn.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitCSRResponse'
    get:
      operationId: receiveCertificateSigningRequests
      summary: grabs CSRs for job submitter approval
      description: >
        Filtered server-side to only requests whose target_submitter_cn
        matches the caller's own mTLS identity.
      responses:
        '200':
          description: OK
  /csrs/{request_id}/certificate:
    get:
      operationId: grabAuthorizedCertificate
      summary: watcher requests its potentially approved CSR
      description: >
        The job watcher calls this server after a few minutes while waiting for
        the job_submitter to approve its role as a watcher.
      security: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: csr has been approved by the job_submitter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateStatus'
  /csrs/{request_id}/approved-certificate:
    post:
      operationId: submitApprovedCertificateSigningRequests
      summary: job watcher submits approved CSRs
      description: >
        The job watcher has authorized the CSR(s) and now submits the certificate chain
        to the server.
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: enrollment has succesfully received the approved certificate
        
